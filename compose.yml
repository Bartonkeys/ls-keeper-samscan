services:
  # floci is a replacement for localstack. It emulates AWS resources (sqs, sns, s3 etc) for local development
  # See: https://floci.io for more details
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  ################################################################################

  ls-keeper-samscan:
    build: ./
    ports:
      - '8085:8085'
    depends_on:
      floci:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      ASPNETCORE_URLS: http://+:8085
      ASPNETCORE_ENVIRONMENT: Development
      # S3 overrides — inside the Docker network, floci is at http://floci:4566
      S3__ServiceUrl: http://floci:4566
      S3__ForcePathStyle: "true"
      S3__BucketName: ls-keeper-samscan
      S3__Region: eu-west-2
      # Set CDP_API_KEY to use ephemeral protected endpoint for local dev
      # Or set APHA_CLIENT_ID + APHA_CLIENT_SECRET for OAuth2 (production-like)
      Apha__BaseUrl: ${APHA_BASE_URL:-https://ephemeral-protected.api.ext-test.cdp-int.defra.cloud/apha-integration-bridge}
      Apha__ApiKey: ${CDP_API_KEY:-}
      Apha__TokenUrl: ${APHA_TOKEN_URL:-}
      Apha__ClientId: ${APHA_CLIENT_ID:-}
      Apha__ClientSecret: ${APHA_CLIENT_SECRET:-}
      # Data Bridge — also uses x-api-key via ephemeral protected endpoint for local dev
      DataBridge__BaseUrl: ${DATA_BRIDGE_URL:-https://ephemeral-protected.api.ext-test.cdp-int.defra.cloud/ls-keeper-data-bridge-backend}
      DataBridge__ApiKey: ${CDP_API_KEY:-}
      # AWS SDK fallback endpoint
      AWS_ENDPOINT_URL: http://floci:4566
    networks:
      - cdp-tenant

################################################################################

networks:
  cdp-tenant:
    driver: bridge
